<!DOCTYPE html>
<html lang='en'>

    <head>
        <meta charset='UTF-8' />
        <meta name='viewport' content='width=device-width, initial-scale=1.0' />
        <title>🐍</title>
        <style>
            h2 {
                color: #aaa;
            }
            body {
                --white: #aaa;
                --gray: #333;
                --black: #000;
                background: var(--black);
                height: 100vh;
                width: 100vw;
                min-width: 640px;
                min-height: 640px;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                overflow: hidden;
            }

            #wrap {
                width: 600px;
                height: 600px;
                border: 1px solid var(--gray);
                border-bottom: none;
                border-right: none;
                display: flex;
                flex-wrap: wrap;
                position: relative;
            }

            .table-item {
                border-bottom: 1px solid var(--gray);
                border-right: 1px solid var(--gray);
                width: 9px;
                height: 9px;
            }

            .snake-item, .food-item {
                width: 9px;
                height: 9px;
                background-color: var(--white);
                position: absolute;
            }

            .food-item {
                border-radius: 50%;
                background-color: aquamarine;
            }

            .food-item.fade, .snake-item.fade {
                animation: fade 400ms infinite;
            }

            @keyframes fade {
                from {
                    opacity: 1;
                }
                50% {
                    opacity: 0.5;
                }
                to {
                    opacity: 1;
                }
            }
        </style>
    </head>

    <body>
        <h2>Press any key to start.</h1>
        <div id='wrap'></div>
        <script>
            const GRID = 60;
            const DIRS = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];

            function wrapCoord(v) { return ((v % GRID) + GRID) % GRID; }

            function heuristic(ax, ay, bx, by, wrap) {
                if (wrap) {
                    return Math.min(Math.abs(ax-bx), GRID-Math.abs(ax-bx))
                         + Math.min(Math.abs(ay-by), GRID-Math.abs(ay-by));
                }
                return Math.abs(ax-bx) + Math.abs(ay-by);
            }

            function astar(startX, startY, goalX, goalY, obstacles, allowThrough) {
                const openMap = new Map();
                const closed = new Set();
                const key = (x,y) => x * GRID + y;
                const sk = key(startX, startY);
                const gk = key(goalX, goalY);
                openMap.set(sk, {x:startX,y:startY,g:0,f:heuristic(startX,startY,goalX,goalY,allowThrough),p:null});

                while (openMap.size > 0) {
                    let bestK = -1, bestF = Infinity, bestNode = null;
                    for (const [k, n] of openMap) {
                        if (n.f < bestF) { bestF = n.f; bestK = k; bestNode = n; }
                    }
                    if (bestK === gk) {
                        const path = [];
                        let c = bestNode;
                        while (c) { path.push({x:c.x, y:c.y}); c = c.p; }
                        return path.reverse();
                    }
                    openMap.delete(bestK);
                    closed.add(bestK);

                    for (const d of DIRS) {
                        let nx = bestNode.x + d.x, ny = bestNode.y + d.y;
                        if (allowThrough) { nx = wrapCoord(nx); ny = wrapCoord(ny); }
                        else if (nx<0||ny<0||nx>=GRID||ny>=GRID) continue;
                        const nk = key(nx, ny);
                        if (closed.has(nk) || obstacles.has(nk)) continue;
                        const g = bestNode.g + 1;
                        const existing = openMap.get(nk);
                        if (existing) {
                            if (g < existing.g) { existing.g = g; existing.f = g + heuristic(nx,ny,goalX,goalY,allowThrough); existing.p = bestNode; }
                        } else {
                            openMap.set(nk, {x:nx,y:ny,g,f:g+heuristic(nx,ny,goalX,goalY,allowThrough),p:bestNode});
                        }
                    }
                }
                return null;
            }

            function buildSnakeSet(snakeData, excludeTail) {
                const s = new Set();
                const len = excludeTail ? snakeData.length - 1 : snakeData.length;
                for (let i = 0; i < len; i++) s.add(snakeData[i].x * GRID + snakeData[i].y);
                return s;
            }
            const dirs = ['left', 'top', 'bottom', 'right'];
            const snake = {
                data: [
                    {
                        x: 3,
                        y: 0,
                    },
                    {
                        x: 2,
                        y: 0,
                    },
                    {
                        x: 1,
                        y: 0,
                    },
                    {
                        x: 0,
                        y: 0,
                    },
                ],
                food: [],
                direction: 'right',
                moveTimer: undefined,
                removeFoodTimer: undefined,
                moveTimeout: 10,
                removeFoodTimeout: 4000,
                gameOver: true,
                allowThrough: true,
                curStep: 0,
                randomStep: parseInt(Math.random() * 30),
                noDeath: true,
                movingPath:null,
                createElement: function (className, position) {
                    const ele = document.createElement('div');
                    ele.setAttribute('class', className);
                    ele.style = `left: ${position.x}px;top: ${position.y}px;`;
                    wrap.appendChild(ele);
                    return ele;
                },
                init: function () {
                    this.resetSake();
                    this.gameOver = false;
                    this.direction = 'right';
                    for (let index = 0; index < this.data.length; index++) {
                        const item = this.createElement('snake-item', {x: this.data[index].x * 10, y: this.data[index].y * 10 });
                        this.data[index].dom = item;
                    }
                    this.start();
                },
                resetSake: function () {
                    this.removeFoodTimer && clearInterval(this.removeFoodTimer);
                    this.moveTimer && clearInterval(this.moveTimer);
                    this.removeAllFood();
                    for (let index = 0; index < this.data.length; index++) {
                        const item = this.data[index];
                        item.dom?.remove();
                    }
                    this.data = [
                        {
                            x: 3,
                            y: 0,
                        },
                        {
                            x: 2,
                            y: 0,
                        },
                        {
                            x: 1,
                            y: 0,
                        },
                        {
                            x: 0,
                            y: 0,
                        },
                    ];
                },
                clearAllInterval: function () {
                    this.removeFoodTimer && clearInterval(this.removeFoodTimer);
                    this.moveTimer && clearInterval(this.moveTimer);
                },
                start: function () {
                    this.moveTimer && clearInterval(this.moveTimer);
                    this.removeFoodTimeout = this.noDeath ? 4000 : 6000;
                    this.moveTimer = setInterval(() => {
                        if (!this.gameOver) {
                            if (this.noDeath) this.computeSafeDirection();
                            this.move();
                            if (!this.noDeath) this.randomDirectionInRandomStep();
                        }
                    }, this.moveTimeout);
                    this.randomFood();
                },
                randomFood: function () {
                    const x = parseInt(Math.random() * 59 + 0);
                    const y = parseInt(Math.random() * 59 + 0);
                    if (this.isCollide({x,y}) || this.isEated({x, y})) {
                        this.randomFood();
                        return;
                    }
                    const dom = this.createElement('food-item', {x: x * 10, y: y * 10});
                    this.food.push({x, y, dom});
                    this.removeFood();
                },
                removeAllFood: function () {
                    for (let index = 0; index < this.food.length; index++) {
                        const item = this.food[index];
                        item.dom.remove();
                    }
                },
                removeFood: function () {
                    this.removeFoodTimer && clearInterval(this.removeFoodTimer);
                    this.removeFoodTimer = setInterval(() => {
                        if (this.food.length > 0) {
                            const dyingFood = this.food[0];
                            dyingFood.dom.classList.add('fade');
                            setTimeout(() => {
                                if (this.food.includes(dyingFood)) {
                                    dyingFood.dom.remove();
                                    const idx = this.food.indexOf(dyingFood);
                                    if (idx !== -1) this.food.splice(idx, 1);
                                    if (this.food.length === 0) {
                                        !this.gameOver && this.randomFood();
                                    }
                                }
                            }, 2000);
                        }
                    }, this.removeFoodTimeout);
                },
                randomDirectionInRandomStep: function () {
                    if(this.curStep >= this.randomStep) {
                        this.curStep = 0;
                        this.randomDirection();
                        this.randomStep = parseInt(Math.random() * 30);
                    }
                },
                randomDirection: function () {
                    const opposite = { left: 'right', right: 'left', top: 'bottom', bottom: 'top' };
                    const available = dirs.filter(d => d !== this.direction && d !== opposite[this.direction]);
                    this.direction = available[Math.floor(Math.random() * available.length)];
                },
                computeSafeDirection: function () {
                    if (!this.food.length) return;
                    const head = this.data[0];
                    const food = this.food[0];
                    const tail = this.data[this.data.length - 1];
                    const snakeSet = buildSnakeSet(this.data, true);

                    const pathToFood = astar(head.x, head.y, food.x, food.y, snakeSet, this.allowThrough);

                    if (pathToFood && pathToFood.length > 1) {
                        const simSnake = this.data.map(s => ({x:s.x, y:s.y}));
                        for (let i = 1; i < pathToFood.length; i++) {
                            simSnake.unshift({x: pathToFood[i].x, y: pathToFood[i].y});
                            if (i < pathToFood.length - 1) simSnake.pop();
                        }
                        const simSet = buildSnakeSet(simSnake, true);
                        const simHead = simSnake[0];
                        const simTail = simSnake[simSnake.length - 1];
                        const canReachTail = astar(simHead.x, simHead.y, simTail.x, simTail.y, simSet, this.allowThrough);

                        if (canReachTail) {
                            this.setDirectionFromStep(head, pathToFood[1]);
                            return;
                        }
                    }

                    const pathToTail = astar(head.x, head.y, tail.x, tail.y, snakeSet, this.allowThrough);
                    if (pathToTail && pathToTail.length > 1) {
                        this.setDirectionFromStep(head, pathToTail[1]);
                        return;
                    }

                    for (const d of DIRS) {
                        let nx = head.x + d.x, ny = head.y + d.y;
                        if (this.allowThrough) { nx = wrapCoord(nx); ny = wrapCoord(ny); }
                        else if (nx<0||ny<0||nx>=GRID||ny>=GRID) continue;
                        if (!snakeSet.has(nx * GRID + ny)) {
                            this.setDirectionFromStep(head, {x:nx, y:ny});
                            return;
                        }
                    }
                },
                setDirectionFromStep: function (from, to) {
                    let dx = to.x - from.x;
                    let dy = to.y - from.y;
                    if (this.allowThrough) {
                        if (dx > 30) dx -= GRID;
                        if (dx < -30) dx += GRID;
                        if (dy > 30) dy -= GRID;
                        if (dy < -30) dy += GRID;
                    }
                    if (dx === 1 || dx === -(GRID-1)) this.direction = 'right';
                    else if (dx === -1 || dx === (GRID-1)) this.direction = 'left';
                    else if (dy === 1 || dy === -(GRID-1)) this.direction = 'bottom';
                    else if (dy === -1 || dy === (GRID-1)) this.direction = 'top';
                },
                move: function () {
                    this.curStep ++;
                    let x, y;
                    if (this.direction === 'right') {
                        x = this.data[0].x + 1;
                        y = this.data[0].y;
                    }
                    if (this.direction === 'left') {
                        x = this.data[0].x - 1;
                        y = this.data[0].y;
                    }
                    if (this.direction === 'top') {
                        x = this.data[0].x;
                        y = this.data[0].y - 1;
                    }
                    if (this.direction === 'bottom') {
                        x = this.data[0].x;
                        y = this.data[0].y + 1;
                    }
                    if (this.allowThrough) {
                        if (x < 0) {
                            x = 59;
                        }
                        if (x > 59) {
                            x = 0;
                        }
                        if (y < 0) {
                            y = 59;
                        }
                        if (y > 59) {
                            y = 0;
                        }
                    }
                    if (this.isEated({x,y})) {
                        this.removeFoodTimer && clearInterval(this.removeFoodTimer);
                        const item = this.createElement('snake-item', {x: x * 10, y: y * 10});
                        this.data.unshift({x,y,dom:item});
                        const index = this.food.findIndex(item => item.x === x && item.y === y);

                        if (index !== -1) {
                            this.food[index].dom.remove();
                            this.food.splice(index, 1);
                            this.randomFood();
                        }
                    } else {
                        const last = this.data.pop();
                        last.x = x;
                        last.y = y;
                        if (!this.checkLive(last)) {
                            this.clearAllInterval();
                            this.data.unshift(last);
                            this.gameOver = true;
                            this.snakeCorpse();
                            return;
                        }
                        this.data.unshift(last);
                        this.setDomStyle(last);
                    }
                },
                setDomStyle: function (item) {
                    item.dom.style = `left: ${item.x * 10}px;top: ${item.y * 10}px;`;
                },
                checkLive: function (nextLastItem) {
                    if (nextLastItem.x >= 60 || nextLastItem.y >= 60 || nextLastItem.x < 0 || nextLastItem.y < 0) {
                        return false;
                    }
                    if (this.isCollide(nextLastItem) && !this.noDeath) {
                        return false;
                    }
                    return true;
                },
                isCollide: function ({ x, y }) {
                    return !!this.data.some((item) => item.x === x && item.y === y);
                },
                isEated: function ({ x, y }) {
                    return !!this.food.some((item) => item.x === x && item.y === y);
                },
                snakeCorpse: function () {
                    for (let index = 0; index < this.data.length; index++) {
                        const item = this.data[index];
                        item.dom && item.dom.classList.add('fade');
                    }
                },
            };
            (function initBackground() {
                for (let index = 0; index < 60 * 60; index++) {
                    const item = document.createElement('div');
                    item.setAttribute('class', 'table-item');
                    wrap.appendChild(item);
                }
            })();
            snake.init();
            window.onkeydown = function (e) {
                if (e.key || e.code) {
                    if ((e.key === 'ArrowDown' || e.key === 's') && snake.direction !== 'top') {
                        snake.direction = 'bottom';
                    }
                    if ((e.key === 'ArrowUp' || e.key === 'w') && snake.direction !== 'bottom') {
                        snake.direction = 'top';
                    }
                    if ((e.key === 'ArrowLeft' || e.key === 'a') && snake.direction !== 'right') {
                        snake.direction = 'left';
                    }
                    if ((e.key === 'ArrowRight' || e.key === 'd') && snake.direction !== 'left') {
                        snake.direction = 'right';
                    }
                    if (snake.gameOver || snake.noDeath) {
                        snake.noDeath = false;
                        snake.moveTimeout = 100;
                        snake.init();
                    }
                }
            };
        </script>
    </body>

</html>
